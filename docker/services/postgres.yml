services:
  postgres:
    image: postgres:18-alpine
    container_name: ai-dd-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ai_dd
      POSTGRES_USER: ai_dd_user
      POSTGRES_PASSWORD: ai_dd_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_dd_user -d ai_dd"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-dd-network

volumes:
  postgres_data:
    driver: local

networks:
  ai-dd-network:
    driver: bridge
