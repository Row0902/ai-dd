[project]
name = "ai-dd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["fastapi[standard]>=0.135.3", "python-dotenv>=1.2.2"]

[dependency-groups]
dev = ["pytest>=9.0.3", "ruff>=0.15.10", "ty>=0.0.29"]

[tool.ruff]
fix = true
indent-width = 4
line-length = 88
target-version = "py313"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
extend-select = ["B", "D", "I", "N", "Q", "UP"]

ignore = ["D203", "D213", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"
root = ["./src"]

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
output-format = "concise"

[tool.pytest.ini_options]
addopts = "-ra -q"
pythonpath = ["src"]
testpaths = ["tests"]
