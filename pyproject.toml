[project]
name = "ai-dd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi[standard]>=0.135.3", "python-dotenv>=1.2.2"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.10",
    "ty>=0.0.29",
]

[tool.ruff]
fix = true
indent-width = 4
line-length = 88
target-version = "py311"

[tool.ruff.analyze]
detect-string-imports = true

[tool.ruff.format]
docstring-code-format = true
indent-style = "space"
line-ending = "auto"
quote-style = "double"

[tool.ruff.lint]
extend-select = ["B", "D", "I", "N", "Q", "UP"]

ignore = ["D203", "D213", "D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.rules]
all = "error"
unused-ignore-comment = "warn"

[tool.ty.environment]
python-version = "3.11"
root = ["./src"]

[tool.ty.terminal]
output-format = "concise"

# Test files: more permissive with mocks and unresolved references
[[tool.ty.overrides]]
include = ["**/test_*.py"]

[tool.ty.overrides.rules]
possibly-unresolved-reference = "warn"

[tool.pytest.ini_options]
addopts = "-ra -q"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
